<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} - TechCart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .cart {
            font-size: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .product-detail {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .product-image {
            width: 400px;
            height: 350px;
            background: #e5e7eb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
        }

        .product-info {
            flex: 1;
        }

        .product-info h1 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stock {
            color: green;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            margin-right: 10px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .back {
            background: #6b7280;
        }

        .back:hover {
            background: #4b5563;
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 700px) {
            .product-detail {
                flex-direction: column;
            }

            .product-image {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🛒 TechCart</div>
    <div class="cart">🛍️ Cart</div>
</header>

<div class="container">

    <div class="product-detail">

        <div class="product-image">
            💻
        </div>

        <div class="product-info">

            <h1>{{ product.name }}</h1>

            <p class="description">
                {{ product.description }}
            </p>

            <p class="price">
                ₹{{ product.price }}
            </p>

            <p class="stock">
                Stock Available: {{ product.stock }}
            </p>

            <a href="{% url 'add_to_cart' product.id %}" class="btn">
                🛒 Add to Cart
            </a>

            <a href="/" class="btn back">
                ← Back to Products
            </a>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 TechCart. All Rights Reserved.</p>
</footer>

</body>
</html>
