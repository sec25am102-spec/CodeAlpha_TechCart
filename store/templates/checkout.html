<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - TechCart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .cart-link {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .order-summary {
            margin-bottom: 30px;
        }

        .product-row {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .total {
            text-align: right;
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
        }

        h2 {
            margin-top: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 25px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

        .place-btn {
            background: #2563eb;
            color: white;
        }

        .place-btn:hover {
            background: #1d4ed8;
        }

        .back-btn:hover {
            background: #4b5563;
        }

    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">
            🛒 TechCart
        </div>

        <a href="{% url 'cart' %}" class="cart-link">
            🛍️ Shopping Cart
        </a>

    </div>


    <div class="container">

        <h1>Checkout</h1>


        <!-- ORDER SUMMARY -->

        <div class="order-summary">

            <h2>Order Summary</h2>

            {% for item in products %}

                <div class="product-row">

                    <div>
                        <strong>{{ item.product.name }}</strong>

                        <br>

                        Quantity:
                        {{ item.quantity }}
                    </div>

                    <div>
                        ₹{{ item.total }}
                    </div>

                </div>

            {% empty %}

                <p>Your cart is empty.</p>

            {% endfor %}

        </div>


        <!-- TOTAL -->

        <div class="total">
            Total: ₹{{ grand_total }}
        </div>


        <!-- CUSTOMER FORM -->

        <h2>Customer Details</h2>

        <form method="POST">

            {% csrf_token %}

            <label for="customer_name">
                Full Name
            </label>

            <input
                type="text"
                id="customer_name"
                name="customer_name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                maxlength="15"
                required
            >


            <label for="address">
                Delivery Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your complete delivery address"
                required
            ></textarea>


            <div class="buttons">

                <a href="{% url 'cart' %}" class="btn back-btn">
                    ← Back to Cart
                </a>

                <button
                    type="submit"
                    class="btn place-btn"
                >
                    Place Order
                </button>

            </div>

        </form>

    </div>

</body>
</html>
